services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env.production
    environment:
      RUN_MIGRATIONS: "true"
    expose:
      - "4000"
    volumes:
      - ${DB_CA_PATH:-./certs/db-ca.pem}:/run/secrets/db-ca.pem:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      portal:
        ipv4_address: 172.30.0.2

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
      - /var/cache/nginx:size=16m,noexec,nosuid
      - /var/run:size=4m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      portal:
        ipv4_address: 172.30.0.3

networks:
  portal:
    ipam:
      config:
        - subnet: 172.30.0.0/24
