services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: file_portal
      MYSQL_USER: portal
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-portal}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  db-init:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: api
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://portal:${MYSQL_PASSWORD:-portal}@mysql:3306/file_portal
    command:
      - sh
      - -c
      - pnpm --filter @portal/api db:migrate:deploy && pnpm --filter @portal/api exec tsx src/scripts/bootstrap-admin.ts
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: api
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://portal:${MYSQL_PASSWORD:-portal}@mysql:3306/file_portal
    depends_on:
      db-init:
        condition: service_completed_successfully
    ports:
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-4000}:4000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: web
    environment:
      API_PROXY_TARGET: http://api:4000
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-localhost,127.0.0.1}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-5173}:5173"
    restart: unless-stopped

volumes:
  mysql_data:
